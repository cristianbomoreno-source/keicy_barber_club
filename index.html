  <style>
    :root {
      --bg: #000000;
      --text: #FFFFFF;
      --text-secondary: #B3B3B3;
      --text-muted: #7A7A7A;
      --divider: #262626;
      --gold: #FFAC48;
      --gold-bright: #FFC27A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Trirong', Georgia, serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      text-align: center;
      background-image: radial-gradient(ellipse at 50% 35%, rgba(255, 172, 72, 0.10), transparent 60%);
    }
    main {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fade-in 1.2s ease-out both;
    }
    .logo { width: min(280px, 70vw); height: auto; margin-bottom: 40px; }
    .eyebrow {
      font-size: 13px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(40px, 10vw, 72px);
      font-weight: 700;
      line-height: 1.05;
      margin-bottom: 20px;
    }
    .line {
      width: 64px;
      height: 2px;
      background: linear-gradient(90deg, var(--gold), var(--gold-bright));
      margin: 0 auto 24px;
    }
    p.lead {
      font-size: 17px;
      line-height: 1.6;
      color: var(--text-secondary);
      margin-bottom: 36px;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 40px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 24px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-gold { background: var(--gold); color: #000; }
    .btn-gold:hover { background: var(--gold-bright); }
    .btn-outline { border: 1px solid var(--divider); color: var(--text); }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
    .btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    footer { font-size: 14px; line-height: 1.7; color: var(--text-muted); }
    footer strong { color: var(--text-secondary); font-weight: 600; }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) { main { animation: none; } }
  </style>
