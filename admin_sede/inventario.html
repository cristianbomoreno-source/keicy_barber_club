<!DOCTYPE html>
<html lang="es" class="no-nav-padding">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Inventario · Admin Sede</title>
<style>html,body{margin:0;padding:0;background:var(--bg);height:100%;}</style>
</head>
<body class="no-nav-padding">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/supabase-client.js"></script>
<script>
const user = dnGetSession();
if (!user || user.role !== 'admin_sede') {
  window.location.replace('../index.html');
} else {
  const sedeId = dnGetTurnoSedeActual();
  if (!sedeId) {
    window.location.replace('seleccionar-sede.html');
  } else {
    dnTienePermisoModulo('inventario').then(tiene => {
      if (!tiene) {
        alert('No tienes permiso para acceder a este módulo');
        window.location.replace('ventas.html');
        return;
      }
      dnSetSedeActual(sedeId);
      window.location.replace('../admin/inventario.html?admin_sede=1');
    });
  }
}
</script>
</body>
</html>
